name: Rust AppImage release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: petal-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install Rust, media and desktop test tools
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --component rust-docs
          rustup default stable
          sudo apt-get update
          sudo apt-get install -y ffmpeg libglib2.0-bin pkg-config libxkbcommon-dev libegl1-mesa-dev libfuse2t64 xvfb xauth jq desktop-file-utils
      - name: Choose automatic version
        id: version
        run: |
          git fetch --tags origin
          version=$(./scripts/release-version.sh --write)
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Test Rust before packaging
        run: ./scripts/test.sh
      - name: Download and verify AppImage tool
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-appimagetool.sh
      - name: Build Rust-only AppImage
        env:
          APPIMAGETOOL: ${{ github.workspace }}/build/tools/appimagetool
        run: ./scripts/build-appimage.sh
      - name: Check packaged Rust app
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          WINIT_UNIX_BACKEND: x11
        run: xvfb-run -a ./scripts/test-appimage.sh dist/Petal-${{ steps.version.outputs.value }}-x86_64.AppImage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Petal-${{ steps.version.outputs.value }}-Rust-x86_64
          path: dist/Petal-*
          if-no-files-found: error
      - name: Create GitHub release after checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          tag="v$RELEASE_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; keeping its assets."
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "Petal $RELEASE_VERSION · Rust" --generate-notes --notes-file packaging/release-notes.md dist/Petal-*
          fi
