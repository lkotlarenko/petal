[package]
name = "petal"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
description = "A small, local Linux video compressor"
repository = "https://github.com/lkotlarenko/petal"

[dependencies]
anyhow = "1.0"
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }
rfd = { version = "=0.15.4", default-features = false, features = ["xdg-portal", "async-std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2.5"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
