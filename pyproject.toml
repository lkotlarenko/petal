[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "petal-video"
dynamic = ["version"]
description = "A careful native VA-API batch video compressor"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7,<7"]

[tool.setuptools.dynamic]
version = {attr = "petal.__version__"}

[project.scripts]
petal = "petal.__main__:main"

[project.urls]
Repository = "https://github.com/lkotlarenko/petal"
Issues = "https://github.com/lkotlarenko/petal/issues"

[tool.setuptools.packages.find]
include = ["petal*"]

[tool.setuptools.package-data]
petal = ["*.svg"]
